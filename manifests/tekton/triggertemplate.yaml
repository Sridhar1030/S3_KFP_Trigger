---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: kfp-trigger-template
  namespace: s3-kfp-trigger
spec:
  params:
    - name: bucket
      description: MinIO bucket name
    - name: object_key
      description: Object key (file path) within bucket
    - name: event_name
      description: Event type (e.g., s3:ObjectCreated:Put)
      default: "s3:ObjectCreated:Put"
    - name: event_time
      description: Event timestamp
      default: ""
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: TaskRun
      metadata:
        generateName: kfp-trigger-
        namespace: s3-kfp-trigger
      spec:
        serviceAccountName: kfp-trigger-sa
        taskSpec:
          params:
            - name: s3_uri
              description: Full S3 URI to the uploaded file
          steps:
            - name: trigger
              image: python:3.11-slim
              script: |
                #!/bin/bash
                set -e

                export HOME=/tmp
                export PATH=$PATH:/tmp/.local/bin

                echo "Installing pyyaml..."
                python3 -m pip install --user --quiet --no-cache-dir pyyaml

                echo "Triggering pipeline for S3 URI: $(params.s3_uri)"
                python3 /scripts/trigger_pipeline.py --s3-uri "$(params.s3_uri)"

              env:
                - name: KFP_HOST
                  value: "https://ds-pipeline-dspa.s3-kfp-trigger.svc.cluster.local:8443"

                - name: PIPELINE_MAPPINGS_PATH
                  value: "/config/mappings.yaml"

                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace

              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: config
                  mountPath: /config

              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "200m"

          volumes:
            - name: scripts
              configMap:
                name: trigger-scripts
            - name: config
              configMap:
                name: pipeline-mappings

        params:
          - name: s3_uri
            value: "s3://$(tt.params.bucket)/$(tt.params.object_key)"
