---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kfp-trigger-sa
  namespace: s3-kfp-trigger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kfp-pipeline-runner
  namespace: s3-kfp-trigger
rules:
  # Permissions to interact with Kubeflow Pipelines
  - apiGroups: ["pipelines.kubeflow.org"]
    resources: ["pipelines"]
    verbs: ["get", "list"]
  - apiGroups: ["pipelines.kubeflow.org"]
    resources: ["runs", "pipelineruns"]
    verbs: ["create", "get", "list"]
  # Permissions to read ConfigMaps (for pipeline routing configuration)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Permissions for Tekton EventListener to watch Trigger resources
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["eventlisteners", "triggerbindings", "triggertemplates", "triggers", "interceptors"]
    verbs: ["get", "list", "watch"]
  # Permissions for EventListener to create TaskRuns
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["create", "get", "list", "watch"]
  # Permissions for EventListener to create events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Permissions to access DSPA API via oauth-proxy (port 8443)
  - apiGroups: ["datasciencepipelinesapplications.opendatahub.io"]
    resources: ["datasciencepipelinesapplications", "datasciencepipelinesapplications/api"]
    verbs: ["get", "create", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kfp-trigger-clusterinterceptor-reader
rules:
  # Permissions for EventListener to read ClusterInterceptors (cluster-scoped)
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["clusterinterceptors"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kfp-trigger-clusterinterceptor-binding
subjects:
  - kind: ServiceAccount
    name: kfp-trigger-sa
    namespace: s3-kfp-trigger
roleRef:
  kind: ClusterRole
  name: kfp-trigger-clusterinterceptor-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kfp-trigger-binding
  namespace: s3-kfp-trigger
subjects:
  - kind: ServiceAccount
    name: kfp-trigger-sa
    namespace: s3-kfp-trigger
roleRef:
  kind: Role
  name: kfp-pipeline-runner
  apiGroup: rbac.authorization.k8s.io
