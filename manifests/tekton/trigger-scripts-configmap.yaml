    #!/usr/bin/env python3
    """
    MinIO-KFP Pipeline Trigger Script
    
    Triggered by Tekton TaskRun when MinIO webhook events are received.
    Routes S3 URIs to appropriate Kubeflow pipelines based on bucket path.
    """
    
    import argparse
    import os
    import sys
    import time
    from typing import Optional, Dict, Any
    
    import yaml
    
    # Import utilities
    from utils.event_logger import setup_logger, log_trigger_event, generate_log_id
    from utils.kfp_client import get_kfp_client, trigger_pipeline
    
    
    # Exit codes
    EXIT_SUCCESS = 0
    EXIT_FAILURE = 1
    EXIT_NO_MATCH = 2
    
    
    def load_config(config_path: str) -> Dict[str, Any]:
        """
        Load pipeline routing configuration from YAML file.
    
        Args:
            config_path: Path to pipeline-mappings.yaml
    
        Returns:
            Configuration dictionary with 'routes' key
    
        Raises:
            FileNotFoundError: If config file not found
            yaml.YAMLError: If config file is invalid YAML
        """
        if not os.path.exists(config_path):
            raise FileNotFoundError(
                f"Pipeline mappings configuration not found: {config_path}\n"
                f"Ensure the ConfigMap is mounted at {config_path}"
            )
    
        with open(config_path, 'r') as f:
            config = yaml.safe_load(f)
    
        if not config or 'routes' not in config:
            raise ValueError(
                f"Invalid configuration: 'routes' key not found in {config_path}"
            )
    
        return config
    
    
    def find_route(s3_uri: str, config: Dict[str, Any]) -> Optional[Dict[str, Any]]:
        """
        Find matching pipeline route for S3 URI using longest-prefix-match.
    
        Args:
            s3_uri: Full S3 URI (e.g., s3://ml-datasets/team-fraud/data.csv)
            config: Configuration dictionary from load_config()
    
        Returns:
            Matching route dict or None if no match
    
        Example:
            >>> config = {'routes': [
            ...     {'prefix': 'ml-datasets/team-fraud/', 'pipeline': 'fraud-v2'},
            ...     {'prefix': 'ml-datasets/', 'pipeline': 'default'}
            ... ]}
            >>> route = find_route('s3://ml-datasets/team-fraud/data.csv', config)
            >>> route['pipeline']
            'fraud-v2'
        """
        # Strip s3:// prefix
        if not s3_uri.startswith('s3://'):
            return None
    
        bucket_key = s3_uri[5:]  # Remove 's3://'
    
        # Get routes and sort by prefix length (longest first for longest-prefix-match)
        routes = config.get('routes', [])
        sorted_routes = sorted(routes, key=lambda r: len(r.get('prefix', '')), reverse=True)
    
        # Find first matching route
        for route in sorted_routes:
            prefix = route.get('prefix', '')
            enabled = route.get('enabled', True)
    
            if enabled and bucket_key.startswith(prefix):
                return route
    
        return None
    
    
    def parse_s3_uri(s3_uri: str) -> tuple[str, str]:
        """
        Parse S3 URI into bucket and key.
    
        Args:
            s3_uri: Full S3 URI (e.g., s3://bucket/path/file.csv)
    
        Returns:
            Tuple of (bucket, object_key)
    
        Example:
            >>> bucket, key = parse_s3_uri('s3://ml-datasets/team-fraud/data.csv')
            >>> bucket
            'ml-datasets'
            >>> key
            'team-fraud/data.csv'
        """
        if not s3_uri.startswith('s3://'):
            raise ValueError(f"Invalid S3 URI format: {s3_uri}")
    
        parts = s3_uri[5:].split('/', 1)
        bucket = parts[0]
        object_key = parts[1] if len(parts) > 1 else ''
    
        return bucket, object_key
    
    
    def main():
        """
        Main entry point for pipeline trigger script.
    
        Reads CLI arguments, loads configuration, routes S3 URI to pipeline,
        and triggers KFP pipeline run.
    
        Exit codes:
            0: Success - pipeline triggered
            1: Failure - error occurred
            2: No match - no route found for S3 URI
        """
        # Parse CLI arguments
        parser = argparse.ArgumentParser(
            description='Trigger Kubeflow pipeline from MinIO upload event'
        )
        parser.add_argument(
            '--s3-uri',
            required=True,
            help='S3 URI to uploaded file (e.g., s3://bucket/path/file.csv)'
        )
        parser.add_argument(
            '--dry-run',
            action='store_true',
            help='Validate routing logic without triggering pipeline'
        )
    
        args = parser.parse_args()
        s3_uri = args.s3_uri
        dry_run = args.dry_run
    
        # Set up logging
        log_level = os.getenv('LOG_LEVEL', 'INFO')
        logger = setup_logger('trigger_pipeline', level=log_level)
    
        # Generate correlation ID
        log_id = generate_log_id()
    
        # Track execution time
        start_time = time.time()
    
        try:
            # Load configuration
            config_path = os.getenv('PIPELINE_MAPPINGS_PATH', '/config/mappings.yaml')
            config = load_config(config_path)
    
            logger.info(f"Configuration loaded from {config_path}")
            logger.info(f"Processing S3 URI: {s3_uri}")
    
            # Find matching route
            route = find_route(s3_uri, config)
    
            if not route:
                # No route matched - log and exit with code 2
                execution_time_ms = int((time.time() - start_time) * 1000)
                bucket, object_key = parse_s3_uri(s3_uri)
    
                log_trigger_event(
                    logger,
                    s3_uri=s3_uri,
                    status='no_match',
                    log_id=log_id,
                    execution_time_ms=execution_time_ms,
                    bucket=bucket,
                    object_key=object_key
                )
    
                return EXIT_NO_MATCH
    
            # Route found
            pipeline_name = route['pipeline']
            namespace = route.get('namespace', os.getenv('NAMESPACE', 's3-kfp-trigger'))
            extra_params = route.get('parameters', {})
    
            logger.info(f"Route matched: {route['prefix']} → {pipeline_name}")
    
            if dry_run:
                logger.info(f"DRY RUN - would trigger pipeline: {pipeline_name}")
                logger.info(f"  Namespace: {namespace}")
                logger.info(f"  Parameters: s3_uri={s3_uri}, {extra_params}")
                return EXIT_SUCCESS
    
            # Get KFP client
            kfp_host = os.getenv('KFP_HOST')
            client = get_kfp_client(host=kfp_host)
    
            logger.info(f"Connected to KFP API: {kfp_host or 'default'}")
    
            # Trigger pipeline
            run = trigger_pipeline(
                client,
                pipeline_name=pipeline_name,
                s3_uri=s3_uri,
                namespace=namespace,
                extra_params=extra_params
            )
    
            # Success - log and exit with code 0
            execution_time_ms = int((time.time() - start_time) * 1000)
            bucket, object_key = parse_s3_uri(s3_uri)
    
            log_trigger_event(
                logger,
                s3_uri=s3_uri,
                status='success',
                log_id=log_id,
                pipeline_run_id=run.id,
                execution_time_ms=execution_time_ms,
                bucket=bucket,
                object_key=object_key,
                pipeline_name=pipeline_name,
                namespace=namespace
            )
    
            return EXIT_SUCCESS
    
        except FileNotFoundError as e:
            # Configuration file not found
            execution_time_ms = int((time.time() - start_time) * 1000)
    
            log_trigger_event(
                logger,
                s3_uri=s3_uri,
                status='failure',
                log_id=log_id,
                error=f"Configuration error: {str(e)}",
                execution_time_ms=execution_time_ms
            )
    
            return EXIT_FAILURE
    
        except ValueError as e:
            # Invalid configuration, S3 URI, or pipeline not found
            execution_time_ms = int((time.time() - start_time) * 1000)
    
            log_trigger_event(
                logger,
                s3_uri=s3_uri,
                status='failure',
                log_id=log_id,
                error=f"Validation error: {str(e)}",
                execution_time_ms=execution_time_ms
            )
    
            return EXIT_FAILURE
    
        except ImportError as e:
            # KFP module not installed
            execution_time_ms = int((time.time() - start_time) * 1000)
    
            log_trigger_event(
                logger,
                s3_uri=s3_uri,
                status='failure',
                log_id=log_id,
                error=f"KFP module not installed: {str(e)}",
                execution_time_ms=execution_time_ms
            )
    
            return EXIT_FAILURE
    
        except Exception as e:
            # Unexpected error
            execution_time_ms = int((time.time() - start_time) * 1000)
    
            log_trigger_event(
                logger,
                s3_uri=s3_uri,
                status='failure',
                log_id=log_id,
                error=f"Unexpected error: {str(e)}",
                execution_time_ms=execution_time_ms
            )
    
            return EXIT_FAILURE
    
    
    if __name__ == '__main__':
        exit_code = main()
        sys.exit(exit_code)
  kfp_client.py: |
    #!/usr/bin/env python3
    """
    Kubeflow Pipelines (KFP) client wrapper with service account authentication.
    
    Provides authenticated KFP client for triggering pipelines from OpenShift pods.
    """
    
    import os
    from typing import Optional
    
    try:
        import kfp
    except ImportError:
        # KFP not installed - allow import for testing
        kfp = None
    
    
    def get_kfp_client(
        host: Optional[str] = None,
        token_path: str = '/var/run/secrets/kubernetes.io/serviceaccount/token',
        ca_cert_path: str = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
    ) -> 'kfp.Client':
        """
        Get authenticated KFP client using service account token.
    
        Reads the Kubernetes service account token mounted in the pod and uses
        it to authenticate with the Kubeflow Pipelines API server.
    
        Args:
            host: KFP API server host URL. If not provided, reads from KFP_HOST env var.
                  Default RHOAI endpoint: https://ds-pipeline-dspa.redhat-ods-applications.svc.cluster.local:8443
            token_path: Path to service account token file (mounted by Kubernetes)
            ca_cert_path: Path to CA certificate for TLS verification
    
        Returns:
            Authenticated kfp.Client instance
    
        Raises:
            ImportError: If kfp module is not installed
            FileNotFoundError: If token or CA cert file not found
            ValueError: If KFP host not specified and KFP_HOST env var not set
            Exception: If KFP client initialization fails
    
        Example:
            >>> client = get_kfp_client()
            >>> run = client.run_pipeline(
            ...     pipeline_name='my-pipeline',
            ...     params={'s3_uri': 's3://bucket/file.csv'}
            ... )
            >>> print(f"Pipeline run ID: {run.id}")
        """
        if kfp is None:
            raise ImportError(
                "kfp module not installed. Install with: pip install kfp>=1.8.0"
            )
    
        # Get KFP host from parameter or environment
        if host is None:
            host = os.getenv('KFP_HOST')
    
        if not host:
            # Default RHOAI endpoint
            host = 'https://ds-pipeline-dspa.redhat-ods-applications.svc.cluster.local:8443'
    
        # Read service account token
        if not os.path.exists(token_path):
            raise FileNotFoundError(
                f"Service account token not found at: {token_path}\n"
                f"Ensure the pod is running with a service account that has KFP permissions."
            )
    
        with open(token_path, 'r') as f:
            token = f.read().strip()
    
        if not token:
            raise ValueError(f"Service account token is empty: {token_path}")
    
        # Verify CA cert exists (required for TLS)
        if not os.path.exists(ca_cert_path):
            raise FileNotFoundError(
                f"CA certificate not found at: {ca_cert_path}\n"
                f"This file should be auto-mounted in Kubernetes pods."
            )
    
        # Create KFP client with token authentication
        try:
            client = kfp.Client(
                host=host,
                existing_token=token,
                ssl_ca_cert=ca_cert_path
            )
    
            return client
    
        except Exception as e:
            raise Exception(
                f"Failed to initialize KFP client for host={host}: {str(e)}"
            ) from e
    
    
    def validate_pipeline_exists(client: 'kfp.Client', pipeline_name: str) -> Optional[str]:
        """
        Validate that a pipeline exists in KFP.
    
        Args:
            client: Authenticated KFP client
            pipeline_name: Name of the pipeline to validate
    
        Returns:
            Pipeline ID if found, None otherwise
    
        Example:
            >>> client = get_kfp_client()
            >>> pipeline_id = validate_pipeline_exists(client, 'fraud-detection-v2')
            >>> if pipeline_id:
            ...     print(f"Pipeline found: {pipeline_id}")
        """
        try:
            # List all pipelines
            pipelines = client.list_pipelines(page_size=1000).pipelines
    
            # Search for pipeline by name
            for pipeline in pipelines:
                if pipeline.name == pipeline_name:
                    return pipeline.id
    
            return None
    
        except Exception as e:
            # Log error but don't raise - caller will handle None return
            print(f"Error listing pipelines: {str(e)}")
            return None
    
    
    def trigger_pipeline(
        client: 'kfp.Client',
        pipeline_name: str,
        s3_uri: str,
        namespace: Optional[str] = None,
        extra_params: Optional[dict] = None
    ) -> 'kfp.models.ApiRun':
        """
        Trigger a KFP pipeline run with parameters.
    
        Args:
            client: Authenticated KFP client
            pipeline_name: Name of the pipeline to trigger
            s3_uri: S3 URI to pass to the pipeline (required parameter)
            namespace: Kubernetes namespace for pipeline execution
            extra_params: Additional parameters to pass to the pipeline
    
        Returns:
            KFP run object with run.id, run.name, run.status
    
        Raises:
            ValueError: If pipeline not found or parameters invalid
            Exception: If pipeline trigger fails
    
        Example:
            >>> client = get_kfp_client()
            >>> run = trigger_pipeline(
            ...     client,
            ...     pipeline_name='fraud-detection-v2',
            ...     s3_uri='s3://ml-datasets/team-fraud/data.csv',
            ...     extra_params={'model_type': 'xgboost'}
            ... )
            >>> print(f"Pipeline triggered: {run.id}")
        """
        # Validate pipeline exists
        pipeline_id = validate_pipeline_exists(client, pipeline_name)
        if not pipeline_id:
            raise ValueError(
                f"Pipeline '{pipeline_name}' not found in KFP.\n"
                f"Upload the pipeline first or check the pipeline name."
            )
    
        # Build parameters
        params = {'s3_uri': s3_uri}
        if extra_params:
            params.update(extra_params)
    
        # Generate job name with timestamp
        from datetime import datetime
        timestamp = datetime.utcnow().strftime('%Y%m%d-%H%M%S')
        job_name = f"minio-trigger-{timestamp}"
    
        # Trigger pipeline
        try:
            run = client.run_pipeline(
                experiment_id=None,  # Use default experiment
                job_name=job_name,
                pipeline_id=pipeline_id,
                params=params,
                namespace=namespace
            )
    
            return run
    
        except Exception as e:
            raise Exception(
                f"Failed to trigger pipeline '{pipeline_name}': {str(e)}"
            ) from e
    
    
    # Example usage for testing
    if __name__ == '__main__':
        import sys
    
        print("KFP Client Wrapper - Test Mode")
        print("=" * 60)
    
        # Check if kfp is installed
        if kfp is None:
            print("❌ KFP not installed")
            print("   Install with: pip install kfp>=1.8.0")
            sys.exit(1)
    
        print(f"✅ KFP version: {kfp.__version__}")
        print()
    
        # Check for service account token (only works inside pod)
        token_path = '/var/run/secrets/kubernetes.io/serviceaccount/token'
        if os.path.exists(token_path):
            print(f"✅ Service account token found: {token_path}")
        else:
            print(f"⚠️  Service account token not found: {token_path}")
            print("   This is normal when running outside a Kubernetes pod.")
            print("   In production, this script runs inside a Tekton TaskRun pod.")
    
        print()
        print("To test pipeline triggering:")
        print("  python3 ../trigger_pipeline.py --s3-uri s3://test-bucket/test.csv")
  event_logger.py: |
    #!/usr/bin/env python3
    """
    Structured logging utility for MinIO-KFP trigger events.
    
    Provides JSON-formatted logging with correlation IDs and execution tracking.
    """
    
    import json
    import logging
    import sys
    import uuid
    from datetime import datetime
    from typing import Optional, Dict, Any
    
    
    class JSONFormatter(logging.Formatter):
        """Custom formatter that outputs logs as JSON."""
    
        def format(self, record: logging.LogRecord) -> str:
            """
            Format log record as JSON.
    
            Args:
                record: Log record to format
    
            Returns:
                JSON-formatted log string
            """
            log_data = {
                'timestamp': datetime.utcnow().isoformat() + 'Z',
                'level': record.levelname,
                'message': record.getMessage(),
            }
    
            # Add any extra fields from the record
            if hasattr(record, 'log_id'):
                log_data['log_id'] = record.log_id
            if hasattr(record, 'execution_time_ms'):
                log_data['execution_time_ms'] = record.execution_time_ms
            if hasattr(record, 's3_uri'):
                log_data['s3_uri'] = record.s3_uri
            if hasattr(record, 'status'):
                log_data['status'] = record.status
            if hasattr(record, 'pipeline_run_id'):
                log_data['pipeline_run_id'] = record.pipeline_run_id
            if hasattr(record, 'error'):
                log_data['error'] = record.error
    
            return json.dumps(log_data)
    
    
    def setup_logger(name: str = 'trigger_pipeline', level: str = 'INFO') -> logging.Logger:
        """
        Set up structured JSON logger.
    
        Args:
            name: Logger name
            level: Log level (DEBUG, INFO, WARNING, ERROR)
    
        Returns:
            Configured logger instance
        """
        logger = logging.getLogger(name)
        logger.setLevel(getattr(logging, level.upper()))
    
        # Remove any existing handlers
        logger.handlers.clear()
    
        # Console handler with JSON formatter
        handler = logging.StreamHandler(sys.stdout)
        handler.setFormatter(JSONFormatter())
        logger.addHandler(handler)
    
        # Don't propagate to root logger
        logger.propagate = False
    
        return logger
    
    
    def generate_log_id() -> str:
        """
        Generate unique correlation ID for log entries.
    
        Returns:
            UUID string
        """
        return str(uuid.uuid4())
    
    
    def log_trigger_event(
        logger: logging.Logger,
        s3_uri: str,
        status: str,
        log_id: Optional[str] = None,
        pipeline_run_id: Optional[str] = None,
        error: Optional[str] = None,
        execution_time_ms: Optional[int] = None,
        **extra_fields
    ) -> None:
        """
        Log a structured trigger event.
    
        Args:
            logger: Logger instance
            s3_uri: S3 URI that triggered the event
            status: Event status (success, failure, no_match)
            log_id: Optional correlation ID (generated if not provided)
            pipeline_run_id: KFP run ID if pipeline was triggered
            error: Error message if status is failure
            execution_time_ms: Execution time in milliseconds
            **extra_fields: Additional fields to include in log
        """
        if log_id is None:
            log_id = generate_log_id()
    
        # Create log message
        if status == 'success':
            message = f"Pipeline triggered successfully: {pipeline_run_id}"
            log_level = logging.INFO
        elif status == 'failure':
            message = f"Pipeline trigger failed: {error}"
            log_level = logging.ERROR
        elif status == 'no_match':
            message = f"No pipeline route matched for: {s3_uri}"
            log_level = logging.WARNING
        else:
            message = f"Unknown status: {status}"
            log_level = logging.WARNING
    
        # Build extra data
        extra = {
            'log_id': log_id,
            's3_uri': s3_uri,
            'status': status,
        }
    
        if pipeline_run_id:
            extra['pipeline_run_id'] = pipeline_run_id
        if error:
            extra['error'] = error
        if execution_time_ms is not None:
            extra['execution_time_ms'] = execution_time_ms
    
        # Add any additional fields
        extra.update(extra_fields)
    
        # Log with extra data
        logger.log(log_level, message, extra=extra)
    
    
    # Example usage
    if __name__ == '__main__':
        # Demo: Set up logger and log sample events
        logger = setup_logger(level='INFO')
    
        # Success event
        log_trigger_event(
            logger,
            s3_uri='s3://ml-datasets/team-fraud/data.csv',
            status='success',
            pipeline_run_id='fraud-run-2026-03-16-abc123',
            execution_time_ms=487
        )
    
        # Failure event
        log_trigger_event(
            logger,
            s3_uri='s3://ml-datasets/team-fraud/data.csv',
            status='failure',
            error='KFP API returned 401: Unauthorized',
            execution_time_ms=1234
        )
    
        # No match event
        log_trigger_event(
            logger,
            s3_uri='s3://ml-datasets/unknown-team/data.csv',
            status='no_match',
            execution_time_ms=12
        )
