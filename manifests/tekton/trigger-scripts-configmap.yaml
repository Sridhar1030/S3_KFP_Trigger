---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trigger-scripts
  namespace: s3-kfp-trigger
data:
  trigger_pipeline.py: |
    #!/usr/bin/env python3
    """
    Self-contained MinIO-KFP Pipeline Trigger Script.

    Calls DSPA v2beta1 REST API directly (no KFP SDK dependency).
    Uses only stdlib + pyyaml.
    """

    import argparse
    import json
    import os
    import ssl
    import sys
    import time
    import urllib.request
    import urllib.error
    import uuid
    from datetime import datetime, timezone

    import yaml

    EXIT_SUCCESS = 0
    EXIT_FAILURE = 1
    EXIT_NO_MATCH = 2

    _sa_token = None
    _ssl_context = None


    def _get_sa_token():
        global _sa_token
        if _sa_token is None:
            token_path = '/var/run/secrets/kubernetes.io/serviceaccount/token'
            if os.path.exists(token_path):
                with open(token_path) as f:
                    _sa_token = f.read().strip()
            else:
                _sa_token = ''
        return _sa_token


    def _get_ssl_context():
        """Internal cluster traffic uses OpenShift service serving certs."""
        global _ssl_context
        if _ssl_context is None:
            _ssl_context = ssl.create_default_context()
            _ssl_context.check_hostname = False
            _ssl_context.verify_mode = ssl.CERT_NONE
        return _ssl_context


    def log(level, message, **fields):
        entry = {
            "timestamp": datetime.now(timezone.utc).isoformat(),
            "level": level,
            "message": message,
        }
        entry.update(fields)
        print(json.dumps(entry), flush=True)


    def load_config(config_path):
        if not os.path.exists(config_path):
            raise FileNotFoundError(f"Config not found: {config_path}")

        with open(config_path, 'r') as f:
            config = yaml.safe_load(f)

        if not config or 'routes' not in config:
            raise ValueError(f"Invalid config: 'routes' key missing in {config_path}")

        return config


    def find_route(s3_uri, config):
        """Longest-prefix-match routing."""
        if not s3_uri.startswith('s3://'):
            return None

        bucket_key = s3_uri[5:]
        routes = config.get('routes', [])
        sorted_routes = sorted(routes, key=lambda r: len(r.get('prefix', '')), reverse=True)

        for route in sorted_routes:
            prefix = route.get('prefix', '')
            enabled = route.get('enabled', True)
            if enabled and bucket_key.startswith(prefix):
                return route

        return None


    def api_call(url, method="GET", body=None):
        """Make an HTTP/HTTPS request to the DSPA API with SA token auth."""
        data = json.dumps(body).encode('utf-8') if body else None
        headers = {}
        if data:
            headers['Content-Type'] = 'application/json'

        token = _get_sa_token()
        if token:
            headers['Authorization'] = f'Bearer {token}'

        req = urllib.request.Request(url, data=data, headers=headers, method=method)

        ctx = _get_ssl_context() if url.startswith('https://') else None
        try:
            resp = urllib.request.urlopen(req, timeout=30, context=ctx)
            return json.loads(resp.read().decode('utf-8'))
        except urllib.error.HTTPError as e:
            error_body = e.read().decode('utf-8') if e.fp else ''
            raise RuntimeError(f"API {method} {url} returned {e.code}: {error_body}")


    def find_pipeline(kfp_host, pipeline_name):
        """Find pipeline by display_name, return (pipeline_id, version_id) or None."""
        data = api_call(f"{kfp_host}/apis/v2beta1/pipelines?page_size=100")

        for p in data.get('pipelines', []):
            if p.get('display_name') == pipeline_name:
                pipeline_id = p['pipeline_id']
                versions = api_call(
                    f"{kfp_host}/apis/v2beta1/pipelines/{pipeline_id}/versions"
                )
                version_list = versions.get('pipeline_versions', [])
                if not version_list:
                    raise ValueError(f"Pipeline '{pipeline_name}' has no versions")
                latest = version_list[0]

                param_names = []
                spec = latest.get('pipeline_spec', {})
                root = spec.get('root', {})
                input_defs = root.get('inputDefinitions', {})
                params = input_defs.get('parameters', {})
                param_names = list(params.keys())

                return {
                    'pipeline_id': pipeline_id,
                    'version_id': latest['pipeline_version_id'],
                    'param_names': param_names,
                }

        return None


    def create_run(kfp_host, pipeline_id, version_id, run_name, runtime_params):
        """Create a pipeline run via DSPA v2beta1 API."""
        body = {
            "display_name": run_name,
            "pipeline_version_reference": {
                "pipeline_id": pipeline_id,
                "pipeline_version_id": version_id,
            },
            "runtime_config": {
                "parameters": runtime_params,
            },
        }
        return api_call(f"{kfp_host}/apis/v2beta1/runs", method="POST", body=body)


    def main():
        parser = argparse.ArgumentParser(description='Trigger KFP pipeline from MinIO event')
        parser.add_argument('--s3-uri', required=True)
        parser.add_argument('--dry-run', action='store_true')
        args = parser.parse_args()

        s3_uri = args.s3_uri
        log_id = str(uuid.uuid4())[:8]
        start_time = time.time()

        try:
            config_path = os.getenv('PIPELINE_MAPPINGS_PATH', '/config/mappings.yaml')
            config = load_config(config_path)
            log("INFO", f"Config loaded from {config_path}", log_id=log_id)

            route = find_route(s3_uri, config)

            if not route:
                log("WARN", f"No route matched for {s3_uri}", log_id=log_id, s3_uri=s3_uri, status="no_match")
                return EXIT_NO_MATCH

            pipeline_name = route['pipeline']
            log("INFO", f"Route matched: {route['prefix']} -> {pipeline_name}", log_id=log_id)

            if args.dry_run:
                log("INFO", f"DRY RUN: would trigger {pipeline_name}", log_id=log_id)
                return EXIT_SUCCESS

            kfp_host = os.getenv('KFP_HOST', 'http://ds-pipeline-dspa:8888')
            log("INFO", f"Connecting to KFP API: {kfp_host}", log_id=log_id)

            pipeline_info = find_pipeline(kfp_host, pipeline_name)
            if not pipeline_info:
                raise ValueError(f"Pipeline '{pipeline_name}' not found in KFP")

            # Build runtime parameters: pass s3_uri to all pipeline input params
            runtime_params = {}
            for param in pipeline_info['param_names']:
                runtime_params[param] = s3_uri

            # Also merge any extra parameters from route config
            extra = route.get('parameters', {})
            if extra:
                runtime_params.update(extra)

            timestamp = datetime.now(timezone.utc).strftime('%Y%m%d-%H%M%S')
            run_name = f"minio-trigger-{timestamp}-{log_id}"

            log("INFO", f"Creating run '{run_name}' with params: {runtime_params}", log_id=log_id)

            result = create_run(
                kfp_host,
                pipeline_info['pipeline_id'],
                pipeline_info['version_id'],
                run_name,
                runtime_params,
            )

            elapsed = int((time.time() - start_time) * 1000)
            run_id = result.get('run_id', 'unknown')

            log("INFO", "Pipeline triggered successfully",
                log_id=log_id, status="success",
                pipeline_run_id=run_id, pipeline=pipeline_name,
                s3_uri=s3_uri, elapsed_ms=elapsed)

            return EXIT_SUCCESS

        except Exception as e:
            elapsed = int((time.time() - start_time) * 1000)
            log("ERROR", f"Trigger failed: {e}",
                log_id=log_id, status="failure",
                s3_uri=s3_uri, error=str(e), elapsed_ms=elapsed)
            return EXIT_FAILURE


    if __name__ == '__main__':
        sys.exit(main())
